<main class="categories-page">

  <section class="categories-intro">
    <div class="categories-container">
      <p class="categories-eyebrow">THE HEIN COLLECTION</p>

      <h1>Find your next favorite.</h1>

      <form class="categories-search" action="#" role="search">
        <i class="bi bi-search" aria-hidden="true"></i>

        <input
          type="search"
          name="category-search"
          placeholder="Explore categories"
          aria-label="Search categories"
        />
      </form>
    </div>
  </section>

  <section class="categories-gallery">
    <div class="categories-container">

      <div class="categories-toolbar">
        <div>
          <h2>Explore categories</h2>
          <p>Discover something made for you.</p>
        </div>

        <span class="categories-count">06 categories</span>
      </div>

      <div class="categories-grid">

        <article class="category-card">
          <div class="category-image-wrapper">
            <img
              src="https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=1000&q=85"
              alt="Modern electronic devices and accessories"
              class="category-image"
              loading="lazy"
            />

            <div class="category-overlay">
              <a
                routerLink="/products/category/electronics"
                class="category-explore"
                aria-label="Explore Electronics"
              >
                Explore
                <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>

          <div class="category-info">
            <h3>Electronics</h3>
          </div>
        </article>

        <article class="category-card">
          <div class="category-image-wrapper">
            <img
              src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=1000&q=85"
              alt="Smartphone with a modern design"
              class="category-image"
              loading="lazy"
            />

            <div class="category-overlay">
              <a
                routerLink="/products/category/smartphones"
                class="category-explore"
                aria-label="Explore Smartphones"
              >
                Explore
                <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>

          <div class="category-info">
            <h3>Smartphones</h3>
          </div>
        </article>

        <article class="category-card">
          <div class="category-image-wrapper">
            <img
              src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1000&q=85"
              alt="Minimal headphones displayed against a clean background"
              class="category-image"
              loading="lazy"
            />

            <div class="category-overlay">
              <a
                routerLink="/products/category/audio"
                class="category-explore"
                aria-label="Explore Audio"
              >
                Explore
                <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>

          <div class="category-info">
            <h3>Audio</h3>
          </div>
        </article>

        <article class="category-card">
          <div class="category-image-wrapper">
            <img
              src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=1000&q=85"
              alt="Laptop on a clean, minimal workspace"
              class="category-image"
              loading="lazy"
            />

            <div class="category-overlay">
              <a
                routerLink="/products/category/computers"
                class="category-explore"
                aria-label="Explore Computers"
              >
                Explore
                <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>

          <div class="category-info">
            <h3>Computers</h3>
          </div>
        </article>

        <article class="category-card">
          <div class="category-image-wrapper">
            <img
              src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1000&q=85"
              alt="Minimal wristwatch with a refined design"
              class="category-image"
              loading="lazy"
            />

            <div class="category-overlay">
              <a
                routerLink="/products/category/accessories"
                class="category-explore"
                aria-label="Explore Wearables"
              >
                Explore
                <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>

          <div class="category-info">
            <h3>Wearables</h3>
          </div>
        </article>

        <article class="category-card">
          <div class="category-image-wrapper">
            <img
              src="https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=1000&q=85"
              alt="Everyday carry accessories arranged neatly"
              class="category-image"
              loading="lazy"
            />

            <div class="category-overlay">
              <a
                routerLink="/products/category/accessories"
                class="category-explore"
                aria-label="Explore Accessories"
              >
                Explore
                <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>

          <div class="category-info">
            <h3>Accessories</h3>
          </div>
        </article>
      </div>
    </div>
  </section>

  <section class="categories-bottom">
    <div class="categories-container">
      <p>Good design makes everyday better.</p>
      <span>Find what fits your world.</span>
    </div>
  </section>
</main>
